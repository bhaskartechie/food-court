services:
  postgres:
    image: postgres:14-alpine
    container_name: society-food-postgres-nobind
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: society_food
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - society_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d society_food"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: society-food-redis-nobind
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - society_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: society-food-backend-nobind
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/society_food
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production-256bits
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      CORS_ORIGINS: "http://localhost:3000,http://localhost"
      ENABLE_OTP_EMAIL: "false"
      ENABLE_WEBSOCKET: "false"
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    networks:
      - society_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: society-food-frontend-nobind
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_LOG_LEVEL: debug
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - society_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  society_network:
    driver: bridge
