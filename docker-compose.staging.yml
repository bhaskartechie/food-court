# Staging docker-compose configuration
# Usage: docker compose -f docker-compose.staging.yml up --build -d

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:14-alpine
    container_name: society-food-postgres-staging
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-staging_secure_pass}
      POSTGRES_DB: society_food_staging
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - society_staging_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d society_food_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis Cache & PubSub ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: society-food-redis-staging
    command: redis-server --appendonly yes
    volumes:
      - redis_data_staging:/data
    networks:
      - society_staging_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend (Staging) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: society-food-backend-staging
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-staging_secure_pass}@postgres:5432/society_food_staging
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-staging-secret-key-society-food-platform-2026}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ENVIRONMENT: staging
      LOG_LEVEL: INFO
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost,http://127.0.0.1}
      WORKERS: 2
      ENABLE_OTP_EMAIL: "true"
      ENABLE_WEBSOCKET: "true"
      PYTHONPATH: /app
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-babu.kishore26@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-hyhnbcopwgmlfxjx}
      SENDER_EMAIL: ${SENDER_EMAIL:-babu.kishore26@gmail.com}
      SENDER_NAME: ${SENDER_NAME:-Society Food Platform}

    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - society_staging_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  # ── React Frontend with Nginx (Staging) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: society-food-frontend-staging
    environment:
      REACT_APP_API_URL: ${API_URL:-http://localhost:8000}
      REACT_APP_LOG_LEVEL: info
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - society_staging_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data_staging:
    driver: local
  redis_data_staging:
    driver: local

networks:
  society_staging_network:
    driver: bridge

